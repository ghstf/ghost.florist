{% extends "base.html" %}
{% block title %}categories · {{ config.title }}{% endblock title %}
{% block content %}
  <section class="interior-page">
    <div class="section-heading"><h1>categories</h1><span class="heading-rule" aria-hidden="true"></span></div>
    <div class="category-list">
      {% for term in terms %}
        <p><a href="{{ term.permalink }}">{{ term.name }}</a></p>
      {% endfor %}
    </div>
  </section>
{% endblock content %}
